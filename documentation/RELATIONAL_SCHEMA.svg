<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><style>.title{font:700 34px Arial;fill:#f8fafc}.sub{font:18px Arial;fill:#cbd5e1}.box{fill:#132b49;stroke:#4da3ff;stroke-width:2.5;rx:12}.head{fill:#1d4d78}.name{font:700 20px Arial;fill:#fff}.field{font:16px 'Courier New',monospace;fill:#e2e8f0}.fk{fill:#fde68a}.line{stroke:#94a3b8;stroke-width:2;fill:none}</style></defs>
<rect width="1600" height="1000" fill="#0b1220"/><text x="60" y="58" class="title">ExamFlow — Relational Schema Diagram</text><text x="60" y="91" class="sub">Relational tables, primary keys, foreign keys, and key constraints</text>
<path class="line" d="M420 240 H560 V340 H650 M420 470 H560 V400 H650 M420 700 H560 V470 H650 M1050 370 H1120 V240 H1190 M1050 470 H1120 V700 H1190 M1360 400 V610"/>
<g><rect class="box" x="60" y="150" width="360" height="220"/><path class="head" d="M72 150 H408 Q420 150 420 162 V194 H60 V162 Q60 150 72 150Z"/><text x="80" y="180" class="name">STUDENTS</text><text x="80" y="225" class="field">PK student_id</text><text x="80" y="253" class="field">UK roll_number</text><text x="80" y="281" class="field">UK email</text><text x="80" y="309" class="field">full_name, program</text><text x="80" y="337" class="field">section, semester</text></g>
<g><rect class="box" x="60" y="400" width="360" height="180"/><path class="head" d="M72 400 H408 Q420 400 420 412 V444 H60 V412 Q60 400 72 400Z"/><text x="80" y="430" class="name">FACULTY</text><text x="80" y="475" class="field">PK faculty_id</text><text x="80" y="503" class="field">UK faculty_code, email</text><text x="80" y="531" class="field">full_name, department</text></g>
<g><rect class="box" x="60" y="620" width="360" height="180"/><path class="head" d="M72 620 H408 Q420 620 420 632 V664 H60 V632 Q60 620 72 620Z"/><text x="80" y="650" class="name">ROOMS</text><text x="80" y="695" class="field">PK room_id</text><text x="80" y="723" class="field">UK room_code</text><text x="80" y="751" class="field">building, capacity</text></g>
<g><rect class="box" x="650" y="250" width="400" height="360"/><path class="head" d="M662 250 H1038 Q1050 250 1050 262 V294 H650 V262 Q650 250 662 250Z"/><text x="670" y="280" class="name">EXAMS</text><text x="670" y="325" class="field">PK exam_id</text><text x="670" y="353" class="field fk">FK subject_id → SUBJECTS</text><text x="670" y="381" class="field fk">FK room_id → ROOMS</text><text x="670" y="409" class="field fk">FK invigilator_id → FACULTY</text><text x="670" y="437" class="field">exam_date, start_time</text><text x="670" y="465" class="field">end_time, section</text><text x="670" y="493" class="field">max_marks, status</text></g>
<g><rect class="box" x="1190" y="140" width="350" height="260"/><path class="head" d="M1202 140 H1528 Q1540 140 1540 152 V184 H1190 V152 Q1190 140 1202 140Z"/><text x="1210" y="170" class="name">SUBJECTS</text><text x="1210" y="215" class="field">PK subject_id</text><text x="1210" y="243" class="field">UK subject_code</text><text x="1210" y="271" class="field">subject_name</text><text x="1210" y="299" class="field">department, semester</text><text x="1210" y="327" class="field">credits</text></g>
<g><rect class="box" x="1190" y="610" width="350" height="220"/><path class="head" d="M1202 610 H1528 Q1540 610 1540 622 V654 H1190 V622 Q1190 610 1202 610Z"/><text x="1210" y="640" class="name">RESULTS</text><text x="1210" y="685" class="field">PK result_id</text><text x="1210" y="713" class="field fk">FK student_id → STUDENTS</text><text x="1210" y="741" class="field fk">FK exam_id → EXAMS</text><text x="1210" y="769" class="field">marks_obtained, grade</text><text x="1210" y="797" class="field">published</text></g>
<text x="60" y="920" class="sub">PK = Primary Key | FK = Foreign Key | UK = Unique Key</text><text x="60" y="950" class="sub">Normalization target: 3NF, with entity facts stored in their own tables and relationships represented by foreign keys.</text>
</svg>